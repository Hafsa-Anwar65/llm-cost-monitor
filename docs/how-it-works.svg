<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57534E"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A8A29E"/></marker>
  </defs>
  <rect width="1000" height="330" rx="14" fill="#F5F1EA"/>

  <!-- Row 1 -->
  <rect x="40" y="50" width="220" height="84" rx="12" fill="#FFFFFF" stroke="#D6CFC4"/>
  <text x="150" y="86" text-anchor="middle" fill="#2B2A28" font-size="16" font-weight="600">Your application</text>
  <text x="150" y="108" text-anchor="middle" fill="#78716C" font-size="12">any OpenAI-style client</text>

  <rect x="390" y="50" width="220" height="84" rx="12" fill="#2B2A28"/>
  <text x="500" y="86" text-anchor="middle" fill="#F5F1EA" font-size="16" font-weight="600">Cost Monitor proxy</text>
  <text x="500" y="108" text-anchor="middle" fill="#D6CFC4" font-size="12">times · counts · prices</text>

  <rect x="740" y="50" width="220" height="84" rx="12" fill="#FFFFFF" stroke="#D6CFC4"/>
  <text x="850" y="86" text-anchor="middle" fill="#2B2A28" font-size="16" font-weight="600">LLM provider</text>
  <text x="850" y="108" text-anchor="middle" fill="#78716C" font-size="12">OpenAI · Anthropic · Gemini</text>

  <!-- Row 2 -->
  <rect x="390" y="210" width="220" height="84" rx="12" fill="#FFFFFF" stroke="#8A9A82" stroke-width="1.5"/>
  <text x="500" y="246" text-anchor="middle" fill="#2B2A28" font-size="16" font-weight="600">Usage log</text>
  <text x="500" y="268" text-anchor="middle" fill="#78716C" font-size="12">one row per request</text>

  <rect x="740" y="210" width="220" height="84" rx="12" fill="#8A9A82"/>
  <text x="850" y="246" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600">Dashboard</text>
  <text x="850" y="268" text-anchor="middle" fill="#F5F1EA" font-size="12">spend · tokens · latency</text>

  <!-- Arrows -->
  <line x1="262" y1="80" x2="386" y2="80" stroke="#57534E" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="388" y1="106" x2="264" y2="106" stroke="#A8A29E" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="324" y="70" text-anchor="middle" fill="#57534E" font-size="11">1  request</text>
  <text x="324" y="126" text-anchor="middle" fill="#78716C" font-size="11">5  response</text>

  <line x1="612" y1="80" x2="736" y2="80" stroke="#57534E" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="738" y1="106" x2="614" y2="106" stroke="#A8A29E" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="674" y="70" text-anchor="middle" fill="#57534E" font-size="11">2  forward</text>
  <text x="674" y="126" text-anchor="middle" fill="#78716C" font-size="11">3  completion</text>

  <line x1="500" y1="136" x2="500" y2="206" stroke="#57534E" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="512" y="176" fill="#57534E" font-size="11">4  log metrics</text>

  <line x1="612" y1="252" x2="736" y2="252" stroke="#57534E" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="674" y="242" text-anchor="middle" fill="#57534E" font-size="11">6  visualise</text>

  <text x="40" y="250" fill="#57534E" font-size="12" font-weight="600">Drop-in setup</text>
  <text x="40" y="270" fill="#78716C" font-size="12">Only the base URL changes;</text>
  <text x="40" y="286" fill="#78716C" font-size="12">your app code stays the same.</text>
</svg>
